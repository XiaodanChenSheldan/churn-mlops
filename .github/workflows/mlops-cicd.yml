name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.10'
  DOCKER_IMAGE: churn-prediction-api
  CI: "true"

jobs:
  # JOB 1: Test the code
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black isort

      - name: Auto-format code
        run: |
          black src/ api.py
          isort src/

      - name: Commit formatted code (optional)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-format code via CI"
      
      - name: Lint code (check style)
        run: |
          flake8 src/ --max-line-length=100 --ignore=E203,W503
          black --check src/ api.py
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # JOB 2: Train & validate model
  train-and-validate:
    name: Train & Validate Model
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Download data
        run: |
          mkdir -p data/raw
          python download_data.py
      
      - name: Train model
        run: |
          mkdir -p /tmp/mlruns  # Create the directory
          python src/train.py
      
      - name: Check model accuracy
        run: |
          python -c "
              import mlflow
              from mlflow.tracking import MlflowClient
              client = MlflowClient()
              # Get latest run
              runs = mlflow.search_runs(experiment_ids=['1'])
              if len(runs) > 0:
              accuracy = runs.iloc[0]['metrics.accuracy']
              assert accuracy > 0.75, f'Accuracy {accuracy} < 0.75'
              print(f'Model validated: accuracy={accuracy}')
          "

  # JOB 3: Build Docker image
  build-docker:
    name: Build Docker Image
    needs: train-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/churn-api:latest
            ${{ secrets.DOCKER_USERNAME }}/churn-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 4: Deploy to production (optional)
  deploy:
    name: Deploy to Production
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to server
        run: |
          echo "Deploying to production server..."
